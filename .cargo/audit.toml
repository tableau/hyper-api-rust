# cargo-audit configuration.
#
# Mirrors the `[advisories].ignore` list in deny.toml. Keep the two in sync;
# each waiver must have the same rationale documented in both files.

[advisories]
ignore = [
    # `rsa` Marvin Attack — no constant-time fix yet. Used only for outbound
    # JWT signing in `hyperdb-api-salesforce`, where timing sidechannels are not
    # observable to a remote attacker. Threat model does not apply.
    "RUSTSEC-2023-0071",
    # `ttf-parser` unmaintained (RUSTSEC-2026-0192, informational). Transitive via
    # `plotters` chart rendering in hyperdb-mcp; no direct use, no patch exists, no
    # runtime risk. Tracking plotters-rs/plotters#736. Mirror of deny.toml.
    "RUSTSEC-2026-0192",
]
